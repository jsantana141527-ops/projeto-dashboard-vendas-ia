<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Dashboard Vendas IA - Julio Santana</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}h1{color:#7b2fff}.card{background:#1e1e1e;padding:20px;border-radius:16px;margin:15px 0;border:1px solid #333}.kpi{font-size:32px;color:#7b2fff;font-weight:bold}</style>
</head>
<body>
<h1>📊 Dashboard Inteligente de Vendas</h1>
<p>Bootcamp Santander DIO - Júlio Santana - Itaúna MG</p>
<div class="card"><div>Total Vendido (6 meses)</div><div class="kpi">R$ 287.500</div></div>
<div class="card"><canvas id="vendas"></canvas></div>
<div class="card"><h3>🤖 Agente IA - Insights</h3><p>✅ Melhor mês: Junho R$62k<br>✅ Produto Top: Frete<br>✅ Recomendação Agente: Aumentar frota Jun/Jul</p></div>
<script>new Chart(document.getElementById('vendas'),{type:'bar',data:{labels:['Jan','Fev','Mar','Abr','Mai','Jun'],datasets:[{label:'Vendas R$',data:[35000,42000,28000,55000,67000,62000],backgroundColor:'#7b2fff'}]},options:{plugins:{legend:{labels:{color:'white'}}}}})</script>
</body>
</html>
